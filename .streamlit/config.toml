# Portfolio Tracker theme: modern fintech. Light and dark variants; the sidebar is deep navy in both.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap, monospace"
baseFontSize = 15
headingFontWeights = [800, 700, 700, 700, 600, 600]
metricValueFontSize = "1.65rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

[theme.light]
primaryColor = "#2456e6"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#dde4ee"
dataframeBorderColor = "#e6ebf3"
dataframeHeaderBackgroundColor = "#f6f8fc"
greenColor = "#0a8f4e"
redColor = "#d92d3a"

[theme.dark]
primaryColor = "#5b8cff"
backgroundColor = "#0a0f1c"
secondaryBackgroundColor = "#141d30"
textColor = "#e7ecf5"
borderColor = "#222d44"
dataframeBorderColor = "#1d2740"
dataframeHeaderBackgroundColor = "#131b2d"
greenColor = "#34d399"
redColor = "#fb7185"

[theme.light.sidebar]
primaryColor = "#7aa2ff"
backgroundColor = "#0b1324"
secondaryBackgroundColor = "#16203a"
textColor = "#dbe3f1"
borderColor = "#24304c"

[theme.dark.sidebar]
primaryColor = "#7aa2ff"
backgroundColor = "#060a14"
secondaryBackgroundColor = "#111a2e"
textColor = "#dbe3f1"
borderColor = "#1c2740"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
